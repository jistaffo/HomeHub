# Render Blueprint for the Top 10 movie app (in top10/).
# Render: New → Blueprint → pick this repo. The persistent disk keeps
# everyone's lists across deploys. Add ANTHROPIC_API_KEY later under the
# service's Environment tab if you want spoiler-free rewrites.
services:
  - type: web
    name: top10
    runtime: node
    plan: starter
    rootDir: top10
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/config
    envVars:
      - key: DATA_FILE
        value: /var/data/top10.json
      - key: TMDB_API_KEY
        sync: false
      - key: OMDB_API_KEY
        sync: false
    disk:
      name: top10-data
      mountPath: /var/data
      sizeGB: 1
